  <main id="main">
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-text">
          <div class="identity">
            <div class="avatar">
              <img src="assets/img/photo.jpg" alt="Dorian Gotty Michelson" width="88" height="88"
                   onerror="this.hidden=true;this.nextElementSibling.hidden=false">
              <span class="avatar-fallback" hidden aria-hidden="true">DG</span>
            </div>
            <div>
              <h1>Dorian Gotty Michelson</h1>
              <p class="role" data-i18n="hero.role"></p>
            </div>
          </div>
          <p class="hero-intro" data-i18n="hero.intro"></p>
          <p class="hero-status" data-i18n="hero.status"></p>
          <div class="cta-row">
            <a class="btn btn-primary" href="#contact" data-i18n="hero.ctaContact"></a>
            <a class="btn btn-secondary" data-cv-link download data-i18n="hero.ctaCv"></a>
            <a class="text-link" href="ia.html" data-i18n="hero.ctaAi"></a>
          </div>
        </div>

        <figure class="net-figure">
          <div class="net-stage">
            <canvas id="net-canvas" data-i18n-attr="aria-label:net.aria" role="img"></canvas>
            <div class="net-readout" aria-live="off">
              <span><span data-i18n="net.iterations"></span> <output data-net-iter>0</output></span>
              <span><span data-i18n="net.accuracy"></span> <output data-net-acc>–</output></span>
            </div>
          </div>
          <div class="net-controls">
            <div class="segmented" role="group">
              <button type="button" class="seg seg-a" data-net-class="0" aria-pressed="true"><span class="dot dot-a" aria-hidden="true"></span><span data-i18n="net.addA"></span></button>
              <button type="button" class="seg seg-b" data-net-class="1" aria-pressed="false"><span class="dot dot-b" aria-hidden="true"></span><span data-i18n="net.addB"></span></button>
            </div>
            <div class="net-actions">
              <button type="button" class="btn btn-small btn-ghost" data-net-toggle></button>
              <button type="button" class="btn btn-small btn-ghost" data-net-reset data-i18n="net.reset"></button>
            </div>
          </div>
          <figcaption data-i18n="net.caption"></figcaption>
        </figure>
      </div>
    </section>

    <section class="section" id="parcours" aria-labelledby="h-exp">
      <div class="container">
        <h2 id="h-exp" data-i18n="sections.experience"></h2>
        <ol class="timeline" data-render="experience"></ol>
      </div>
    </section>

    <section class="section" id="projets" aria-labelledby="h-proj">
      <div class="container">
        <h2 id="h-proj" data-i18n="sections.projects"></h2>
        <div class="projects" data-render="projects"></div>
      </div>
    </section>

    <section class="section" id="competences" aria-labelledby="h-skills">
      <div class="container">
        <h2 id="h-skills" data-i18n="sections.skills"></h2>
        <div class="skills" data-render="skills"></div>
      </div>
    </section>

    <section class="section" id="formation">
      <div class="container two-col">
        <div>
          <h2 data-i18n="sections.education"></h2>
          <ul class="plain-list" data-render="education"></ul>
        </div>
        <div>
          <h2 data-i18n="sections.languages"></h2>
          <ul class="plain-list" data-render="languages"></ul>
        </div>
      </div>
    </section>

    <section class="section" id="passions" aria-labelledby="h-passions">
      <div class="container">
        <h2 id="h-passions" data-i18n="sections.passions"></h2>
        <div class="passions" data-render="passions"></div>
      </div>
    </section>

    <section class="section section-contact" id="contact" aria-labelledby="h-contact">
      <div class="container contact-grid">
        <div>
          <h2 id="h-contact" data-i18n="sections.contact"></h2>
          <p class="contact-intro" data-i18n="contact.intro"></p>
          <form class="contact-form" data-contact-form novalidate>
            <div class="field">
              <label for="cf-name" data-i18n="contact.name"></label>
              <input id="cf-name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="cf-email" data-i18n="contact.email"></label>
              <input id="cf-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="cf-message" data-i18n="contact.message"></label>
              <textarea id="cf-message" name="message" rows="6" required></textarea>
            </div>
            <!-- Champ piège anti-spam, invisible pour les humains -->
            <div class="hp" aria-hidden="true">
              <label>Ne pas remplir <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
            </div>
            <button class="btn btn-primary" type="submit" data-i18n="contact.send"></button>
            <p class="form-status" role="status" aria-live="polite" data-form-status></p>
          </form>
        </div>
        <aside class="contact-direct">
          <h3 data-i18n="contact.direct"></h3>
          <ul class="direct-list">
            <li data-contact="email"><span class="direct-label" data-i18n="contact.emailLabel"></span><a data-contact-link></a></li>
            <li data-contact="linkedin"><span class="direct-label" data-i18n="contact.linkedinLabel"></span><a data-contact-link target="_blank" rel="noopener"></a></li>
            <li data-contact="github"><span class="direct-label" data-i18n="contact.githubLabel"></span><a data-contact-link target="_blank" rel="noopener"></a></li>
            <li data-contact="cv"><span class="direct-label" data-i18n="contact.cvLabel"></span><a data-contact-link download></a></li>
          </ul>
        </aside>
      </div>
    </section>
